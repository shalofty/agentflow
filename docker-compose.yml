services:
  customer-verification:
    build: ./mocks/customer-verification
    ports:
      - "8091:8091"
    environment:
      PORT: 8091
  policy-eligibility:
    build: ./mocks/policy-eligibility
    ports:
      - "8092:8092"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentflow
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: agentflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow -d agentflow"]
      interval: 5s
      timeout: 5s
      retries: 10
