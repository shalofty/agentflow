spring:
  application:
    name: agentflow-api
  datasource:
    url: jdbc:postgresql://localhost:5432/agentflow
    username: agentflow
    password: agentflow
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: 8080
agentflow:
  integrations:
    # Required against Cloudflare Worker mocks; leave empty for local Docker mocks.
    mock-shared-secret: ${AGENTFLOW_MOCK_SHARED_SECRET:}
    customer-verification:
      base-url: http://localhost:8091
      connect-timeout-ms: 1000
      read-timeout-ms: 2000
    policy-eligibility:
      url: http://localhost:8092/ws
      connect-timeout: 1s
      read-timeout: 2s
