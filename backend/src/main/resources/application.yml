spring:
  application:
    name: agentflow-api
  datasource:
    url: jdbc:postgresql://localhost:5432/agentflow
    username: agentflow
    password: agentflow
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: 8080
agentflow:
  integrations:
    customer-verification:
      base-url: http://localhost:8091
      connect-timeout-ms: 1000
      read-timeout-ms: 2000
